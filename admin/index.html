<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuply Ad Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f6f3ee;
    --panel:#221f1b;
    --panel-2:#2b2722;
    --line:rgba(255,255,255,0.08);
    --line-soft:rgba(28,26,23,0.1);
    --accent:#ff6a3d;
    --accent-2:#ffb648;
    --muted:#a89f92;
    --ok:#7bc088;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:var(--panel);
    color:#efeae1;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:260px 1fr 300px;
    grid-template-rows:56px 1fr;
    height:100vh;
  }
  header{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.2px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
  }
  .brand small{
    font-family:'Manrope',sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-left:6px;
  }
  .fmt-tabs{
    display:flex;
    gap:4px;
    background:var(--panel-2);
    padding:4px;
    border-radius:999px;
  }
  .fmt-tabs button{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:7px 14px;
    border-radius:999px;
    font-family:'Manrope',sans-serif;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .fmt-tabs button.active{
    background:var(--accent);
    color:#1c1a17;
  }
  .export-btn{
    border:none;
    background:var(--ok);
    color:#122015;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .export-btn:hover{filter:brightness(1.08);}

  /* Sidebar (layers + add) */
  .side-left{
    border-right:1px solid var(--line);
    padding:16px;
    overflow-y:auto;
    background:var(--panel);
  }
  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--muted);
    font-weight:700;
    margin:18px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .add-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .add-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:#efeae1;
    padding:12px 6px;
    cursor:pointer;
    font-size:11.5px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
  }
  .add-btn:hover{border-color:var(--accent);}
  .add-btn svg{width:18px;height:18px;stroke:var(--accent-2);}
  .layer-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 10px;
    border-radius:8px;
    background:var(--panel-2);
    margin-bottom:6px;
    cursor:pointer;
    border:1px solid transparent;
    font-size:12.5px;
  }
  .layer-item.selected{border-color:var(--accent);}
  .layer-item .lname{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:8px;
  }
  .layer-item .ltag{
    font-size:9.5px;text-transform:uppercase;color:var(--muted);
    background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;
  }
  .layer-item .ldel{
    color:var(--muted);background:none;border:none;cursor:pointer;font-size:14px;
    opacity:0;transition:.15s;
  }
  .layer-item:hover .ldel{opacity:1;}
  .layer-item .ldel:hover{color:#ff6b6b;}
  .empty-hint{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.5;
    padding:10px 0;
  }

  /* Canvas center */
  .stage{
    background:
      linear-gradient(45deg,#2c2924 25%,transparent 25%) -20px 0/40px 40px,
      linear-gradient(-45deg,#2c2924 25%,transparent 25%) -20px 0/40px 40px,
      linear-gradient(45deg,transparent 75%,#2c2924 75%) -20px 0/40px 40px,
      linear-gradient(-45deg,transparent 75%,#2c2924 75%) -20px 0/40px 40px,
      #231f1a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    position:relative;
  }
  #adCanvas{
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border-radius:2px;
    cursor:default;
  }
  .stage-caption{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    font-size:11.5px;
    color:var(--muted);
    background:rgba(0,0,0,0.35);
    padding:5px 12px;
    border-radius:999px;
  }

  /* Right panel */
  .side-right{
    border-left:1px solid var(--line);
    padding:16px;
    overflow-y:auto;
    background:var(--panel);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:6px;
  }
  .field textarea,
  .field input[type=text],
  .field select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:#efeae1;
    border-radius:8px;
    padding:8px 10px;
    font-family:'Manrope',sans-serif;
    font-size:13px;
    resize:vertical;
  }
  .field textarea{min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field input[type=range]{width:100%;}
  .swatches{display:flex;flex-wrap:wrap;gap:6px;}
  .swatch{
    width:24px;height:24px;border-radius:6px;cursor:pointer;
    border:2px solid rgba(255,255,255,0.15);
  }
  .swatch.active{border-color:#fff;}
  input[type=color]{
    -webkit-appearance:none;
    width:34px;height:28px;border:none;background:none;cursor:pointer;padding:0;
  }
  .color-row{display:flex;align-items:center;gap:8px;}
  .align-row{display:flex;gap:6px;}
  .align-row button{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:#efeae1;
    padding:7px 0;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
  }
  .align-row button.active{background:var(--accent);color:#1c1a17;border-color:var(--accent);}
  .file-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--panel-2);
    border:1px dashed var(--line);
    color:var(--muted);
    padding:14px;
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
  }
  .file-btn:hover{border-color:var(--accent);color:#efeae1;}
  .logo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .logo-btn{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 4px 7px;cursor:pointer;color:var(--muted);font-size:10px;
    text-align:center;line-height:1.2;
  }
  .logo-btn:hover{border-color:var(--accent);color:#efeae1;}
  .logo-btn img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;}
  .side-right .empty-hint{text-align:center;margin-top:60px;}
  .bg-mode-row{display:flex;gap:6px;margin-bottom:10px;}
  .bg-mode-row button{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:#efeae1;
    padding:6px 0;border-radius:7px;font-size:11.5px;cursor:pointer;
  }
  .bg-mode-row button.active{background:var(--accent);color:#1c1a17;border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span>Chuply Ad Studio<small>internal</small></div>
    <div class="fmt-tabs" id="fmtTabs"></div>
    <button class="export-btn" id="exportBtn">⬇ Export PNG</button>
  </header>

  <div class="side-left">
    <div class="section-label">Add to canvas</div>
    <div class="add-row">
      <button class="add-btn" id="addText">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        Text
      </button>
      <button class="add-btn" id="addImage">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Image
      </button>
      <button class="add-btn" id="addCta">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>
        CTA badge
      </button>
      <button class="add-btn" id="addShape">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
        Shape
      </button>
    </div>

    <div class="section-label">Background</div>
    <div class="swatches" id="bgSwatches"></div>

    <div class="section-label">Brand</div>
    <div class="logo-grid" id="logoGrid"></div>

    <div class="section-label">Layers</div>
    <div id="layerList"><div class="empty-hint">Nothing on the canvas yet. Add text or an image to get started.</div></div>
  </div>

  <div class="stage">
    <canvas id="adCanvas"></canvas>
    <div class="stage-caption" id="stageCaption"></div>
  </div>

  <div class="side-right" id="propsPanel">
    <div class="empty-hint">Select a layer to edit its content, color, size and position.<br><br>Drag any element directly on the canvas to move it.</div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

  const canvas = document.getElementById('adCanvas');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('fileInput');
  const layerListEl = document.getElementById('layerList');
  const propsPanel = document.getElementById('propsPanel');
  const stageCaption = document.getElementById('stageCaption');

  function uid(){ return 'l' + (idCounter++); }

  function fmt(){ return FORMATS[currentFormat]; }

  function setCanvasSize(){
    const f = fmt();
    canvas.width = f.w;
    canvas.height = f.h;
    const maxDisplay = 560;
    const scale = Math.min(maxDisplay / f.w, maxDisplay / f.h, 1);
    canvas.style.width = (f.w*scale)+'px';
    canvas.style.height = (f.h*scale)+'px';
    stageCaption.textContent = f.label + '  ·  ' + f.w + '×' + f.h + 'px';
  }

  // ---------- Layer factories ----------
  function addTextLayer(kind){
    const f = fmt();
    const isHeadline = kind === 'headline';
    const l = {
      id: uid(), type:'text', name: kind==='headline' ? 'Headline' : 'Text',
      text: kind==='headline' ? 'Simple software for SA businesses' : 'Online stores, field service, tuckshops & loyalty — priced in ZAR',
      x: f.w/2, y: kind==='headline' ? f.h*0.42 : f.h*0.55,
      size: kind==='headline' ? Math.round(f.w*0.08) : Math.round(f.w*0.032),
      color:'#f8fafc', font:'Inter', weight: kind==='headline' ? '800':'500',
      align:'center', maxWidth: Math.round(f.w*0.82)
    };
    layers.push(l); select(l.id); render();
  }

  function addCtaBadge(){
    const f = fmt();
    const l = {
      id: uid(), type:'cta', name:'CTA badge',
      text:'Get Chuply', x: f.w/2, y: f.h*0.82,
      size: Math.round(f.w*0.032), color:'#ffffff', bg:'#16a34a',
      font:'Inter', weight:'700', padX: Math.round(f.w*0.045), padY: Math.round(f.w*0.022)
    };
    layers.push(l); select(l.id); render();
  }

  function addShapeLayer(){
    const f = fmt();
    const l = {
      id: uid(), type:'shape', name:'Shape',
      x:f.w*0.1, y:f.h*0.1, w:f.w*0.3, h:f.w*0.3*0.6,
      color:'#16a34a', opacity:1, radius:16
    };
    layers.push(l); select(l.id); render();
  }

  function fitImageLayerToCanvas(l, mode){
    const f = fmt();
    const natW = l.natW, natH = l.natH;
    if(!natW || !natH) return;
    let scale;
    if(mode==='cover'){
      scale = Math.max(f.w/natW, f.h/natH);
    } else if(mode==='contain'){
      scale = Math.min(f.w/natW, f.h/natH);
    } else { // 'containCapped' — used as the default for small brand logos, never upscales
      scale = Math.min(f.w*0.8/natW, f.h*0.8/natH, 1);
    }
    const w = natW*scale, h = natH*scale;
    l.w = w; l.h = h;
    l.x = (f.w-w)/2; l.y = (f.h-h)/2;
    l.fitMode = mode;
  }

  function addImageLayer(dataUrl, natW, natH, opts){
    opts = opts || {};
    const l = {
      id: uid(), type:'image', name:'Image',
      src:dataUrl, natW, natH, x:0, y:0, w:0, h:0, radius:0
    };
    fitImageLayerToCanvas(l, opts.fit || 'containCapped');
    layers.push(l); select(l.id); render();
  }

  // ---------- Selection & layer list ----------
  function select(id){
    selectedId = id;
    renderLayerList();
    renderProps();
  }

  function deleteLayer(id){
    layers = layers.filter(l=>l.id!==id);
    if(selectedId===id) selectedId=null;
    renderLayerList(); renderProps(); render();
  }

  function layerLabel(l){
    if(l.type==='text' || l.type==='cta') return l.text.slice(0,22)||'(empty text)';
    if(l.type==='image') return 'Uploaded image';
    if(l.type==='shape') return 'Shape';
    return l.name;
  }

  function renderLayerList(){
    if(layers.length===0){
      layerListEl.innerHTML = '<div class="empty-hint">Nothing on the canvas yet. Add text or an image to get started.</div>';
      return;
    }
    layerListEl.innerHTML = '';
    // top-of-list = top-of-stack, so show reversed
    [...layers].reverse().forEach(l=>{
      const row = document.createElement('div');
      row.className = 'layer-item' + (l.id===selectedId ? ' selected':'');
      row.innerHTML = `<span class="lname"><span class="ltag">${l.type}</span>${layerLabel(l)}</span><button class="ldel" title="Delete">✕</button>`;
      row.addEventListener('click', (e)=>{
        if(e.target.classList.contains('ldel')) return;
        select(l.id);
      });
      row.querySelector('.ldel').addEventListener('click', (e)=>{ e.stopPropagation(); deleteLayer(l.id); });
      layerListEl.appendChild(row);
    });
  }

  // ---------- Properties panel ----------
  function renderProps(){
    const l = layers.find(x=>x.id===selectedId);
    if(!l){
      propsPanel.innerHTML = '<div class="empty-hint">Select a layer to edit its content, color, size and position.<br><br>Drag any element directly on the canvas to move it.</div>';
      return;
    }
    let html = '';
    if(l.type==='text' || l.type==='cta'){
      html += `<div class="field"><label>Copy</label><textarea id="p_text">${escapeHtml(l.text)}</textarea></div>`;
      html += `<div class="field"><label>Font size</label><input type="range" id="p_size" min="12" max="220" value="${l.size}"></div>`;
      html += `<div class="field"><label>Weight</label>
        <div class="align-row">
          <button data-w="400" class="${l.weight==='400'?'active':''}">Regular</button>
          <button data-w="600" class="${l.weight==='600'?'active':''}">Medium</button>
          <button data-w="700" class="${l.weight==='700'?'active':''}">Bold</button>
        </div></div>`;
      html += `<div class="field"><label>Color</label><div class="swatches" id="p_colorSw"></div>
        <div class="color-row" style="margin-top:8px;"><input type="color" id="p_colorPick" value="${l.color}"><span style="font-size:12px;color:var(--muted)">custom</span></div></div>`;
      if(l.type==='text'){
        html += `<div class="field"><label>Align</label><div class="align-row">
          <button data-a="left" class="${l.align==='left'?'active':''}">Left</button>
          <button data-a="center" class="${l.align==='center'?'active':''}">Center</button>
          <button data-a="right" class="${l.align==='right'?'active':''}">Right</button>
        </div></div>`;
      }
      if(l.type==='cta'){
        html += `<div class="field"><label>Badge color</label><div class="swatches" id="p_bgSw"></div>
          <div class="color-row" style="margin-top:8px;"><input type="color" id="p_bgPick" value="${l.bg}"><span style="font-size:12px;color:var(--muted)">custom</span></div></div>`;
      }
    } else if(l.type==='shape'){
      html += `<div class="field"><label>Color</label><div class="swatches" id="p_colorSw"></div>
        <div class="color-row" style="margin-top:8px;"><input type="color" id="p_colorPick" value="${l.color}"><span style="font-size:12px;color:var(--muted)">custom</span></div></div>`;
      html += `<div class="field"><label>Corner radius</label><input type="range" id="p_radius" min="0" max="120" value="${l.radius}"></div>`;
      html += `<div class="field"><label>Opacity</label><input type="range" id="p_opacity" min="10" max="100" value="${Math.round(l.opacity*100)}"></div>`;
      html += `<div class="row2"><div class="field"><label>Width</label><input type="text" id="p_w" value="${Math.round(l.w)}"></div>
        <div class="field"><label>Height</label><input type="text" id="p_h" value="${Math.round(l.h)}"></div></div>`;
    } else if(l.type==='image'){
      html += `<div class="field"><label>Fit to canvas</label><div class="align-row">
        <button id="p_fitCover" class="${l.fitMode==='cover'?'active':''}">Fill</button>
        <button id="p_fitContain" class="${l.fitMode==='contain'?'active':''}">Fit</button>
      </div></div>`;
      html += `<div class="field"><label>Corner radius</label><input type="range" id="p_radius" min="0" max="200" value="${l.radius}"></div>`;
      html += `<div class="row2"><div class="field"><label>Width</label><input type="text" id="p_w" value="${Math.round(l.w)}"></div>
        <div class="field"><label>Height</label><input type="text" id="p_h" value="${Math.round(l.h)}"></div></div>`;
      html += `<label class="file-btn" id="p_replace">Replace image</label>`;
    }
    html += `<div class="section-label">Layer order</div>
      <div class="align-row">
        <button id="p_front">Bring to front</button>
        <button id="p_back">Send to back</button>
      </div>`;
    propsPanel.innerHTML = html;
    bindPropEvents(l);
  }

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function buildSwatches(containerId, current, onPick){
    const el = document.getElementById(containerId);
    if(!el) return;
    el.innerHTML = '';
    PALETTE.forEach(c=>{
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c.toLowerCase()===current.toLowerCase() ? ' active':'');
      sw.style.background = c;
      sw.addEventListener('click', ()=>onPick(c));
      el.appendChild(sw);
    });
  }

  function bindPropEvents(l){
    const t = document.getElementById('p_text');
    if(t) t.addEventListener('input', e=>{ l.text = e.target.value; renderLayerList(); render(); });

    const size = document.getElementById('p_size');
    if(size) size.addEventListener('input', e=>{ l.size = parseInt(e.target.value); render(); });

    document.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click', ()=>{ l.weight=b.dataset.w; renderProps(); render(); }));
    document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click', ()=>{ l.align=b.dataset.a; renderProps(); render(); }));

    buildSwatches('p_colorSw', l.color||'#000000', c=>{ l.color=c; renderProps(); render(); });
    const cp = document.getElementById('p_colorPick');
    if(cp) cp.addEventListener('input', e=>{ l.color=e.target.value; render(); });

    if(l.type==='cta'){
      buildSwatches('p_bgSw', l.bg, c=>{ l.bg=c; renderProps(); render(); });
      const bp = document.getElementById('p_bgPick');
      if(bp) bp.addEventListener('input', e=>{ l.bg=e.target.value; render(); });
    }

    const rad = document.getElementById('p_radius');
    if(rad) rad.addEventListener('input', e=>{ l.radius=parseInt(e.target.value); render(); });
    const op = document.getElementById('p_opacity');
    if(op) op.addEventListener('input', e=>{ l.opacity=parseInt(e.target.value)/100; render(); });
    const w = document.getElementById('p_w');
    if(w) w.addEventListener('change', e=>{ l.w=Math.max(4,parseInt(e.target.value)||l.w); if(l.type==='image') l.fitMode=null; render(); });
    const h = document.getElementById('p_h');
    if(h) h.addEventListener('change', e=>{ l.h=Math.max(4,parseInt(e.target.value)||l.h); if(l.type==='image') l.fitMode=null; render(); });

    const fitCover = document.getElementById('p_fitCover');
    if(fitCover) fitCover.addEventListener('click', ()=>{ fitImageLayerToCanvas(l,'cover'); renderProps(); render(); });
    const fitContain = document.getElementById('p_fitContain');
    if(fitContain) fitContain.addEventListener('click', ()=>{ fitImageLayerToCanvas(l,'contain'); renderProps(); render(); });

    const rep = document.getElementById('p_replace');
    if(rep) rep.addEventListener('click', ()=>{ fileInput.dataset.mode='replace'; fileInput.dataset.target=l.id; fileInput.click(); });

    const front = document.getElementById('p_front');
    if(front) front.addEventListener('click', ()=>{ layers = layers.filter(x=>x.id!==l.id); layers.push(l); renderLayerList(); render(); });
    const back = document.getElementById('p_back');
    if(back) back.addEventListener('click', ()=>{ layers = layers.filter(x=>x.id!==l.id); layers.unshift(l); renderLayerList(); render(); });
  }

  // ---------- Rendering ----------
  const imageCache = {};
  function getImg(src){
    if(imageCache[src]) return imageCache[src];
    const im = new Image();
    im.src = src;
    im.onload = render;
    imageCache[src] = im;
    return im;
  }

  function wrapText(text, maxWidth){
    const words = text.split(/\s+/);
    const lines = [];
    let cur = '';
    words.forEach(w=>{
      const test = cur ? cur+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && cur){
        lines.push(cur); cur = w;
      } else { cur = test; }
    });
    if(cur) lines.push(cur);
    return lines;
  }

  function roundRectPath(x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function render(){
    const f = fmt();
    ctx.clearRect(0,0,f.w,f.h);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0,0,f.w,f.h);

    layers.forEach(l=>{
      if(l.type==='shape'){
        ctx.save();
        ctx.globalAlpha = l.opacity ?? 1;
        ctx.fillStyle = l.color;
        roundRectPath(l.x,l.y,l.w,l.h,l.radius);
        ctx.fill();
        ctx.restore();
      } else if(l.type==='image'){
        const im = getImg(l.src);
        if(im.complete && im.naturalWidth){
          ctx.save();
          roundRectPath(l.x,l.y,l.w,l.h,l.radius||0);
          ctx.clip();
          ctx.drawImage(im, l.x, l.y, l.w, l.h);
          ctx.restore();
        }
      } else if(l.type==='text'){
        ctx.save();
        ctx.fillStyle = l.color;
        ctx.font = `${l.weight} ${l.size}px 'Fraunces', serif`;
        if(l.font==='Manrope') ctx.font = `${l.weight} ${l.size}px 'Manrope', sans-serif`;
        ctx.textAlign = l.align;
        ctx.textBaseline = 'middle';
        const lines = wrapText(l.text, l.maxWidth || f.w*0.8);
        const lineH = l.size*1.18;
        const totalH = lineH*lines.length;
        let startY = l.y - totalH/2 + lineH/2;
        const drawX = l.align==='left' ? l.x - (l.maxWidth||f.w*0.8)/2
                    : l.align==='right' ? l.x + (l.maxWidth||f.w*0.8)/2
                    : l.x;
        lines.forEach((line,i)=>{
          ctx.fillText(line, drawX, startY + i*lineH);
        });
        l._h = totalH; l._w = l.maxWidth || f.w*0.8;
        ctx.restore();
      } else if(l.type==='cta'){
        ctx.save();
        ctx.font = `${l.weight} ${l.size}px 'Manrope', sans-serif`;
        const tw = ctx.measureText(l.text).width;
        const bw = tw + l.padX*2;
        const bh = l.size + l.padY*2;
        l._w = bw; l._h = bh;
        const bx = l.x - bw/2, by = l.y - bh/2;
        ctx.fillStyle = l.bg;
        roundRectPath(bx,by,bw,bh,bh/2);
        ctx.fill();
        ctx.fillStyle = l.color;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(l.text, l.x, l.y+1);
        ctx.restore();
      }

      if(l.id===selectedId){
        ctx.save();
        ctx.strokeStyle = '#ff6a3d';
        ctx.lineWidth = Math.max(2, f.w*0.0018);
        ctx.setLineDash([f.w*0.01, f.w*0.008]);
        const b = boundsOf(l, f);
        ctx.strokeRect(b.x-6, b.y-6, b.w+12, b.h+12);
        ctx.restore();
      }
    });
  }

  function boundsOf(l, f){
    if(l.type==='shape' || l.type==='image'){
      return {x:l.x, y:l.y, w:l.w, h:l.h};
    }
    if(l.type==='text'){
      const w = l._w || (l.maxWidth||f.w*0.8);
      const h = l._h || l.size*1.2;
      const x = l.align==='left' ? l.x : l.align==='right' ? l.x-w : l.x-w/2;
      return {x, y:l.y-h/2, w, h};
    }
    if(l.type==='cta'){
      const w = l._w || 100, h = l._h || l.size*2;
      return {x:l.x-w/2, y:l.y-h/2, w, h};
    }
    return {x:0,y:0,w:0,h:0};
  }

  function hitTest(px, py){
    for(let i=layers.length-1;i>=0;i--){
      const l = layers[i];
      const b = boundsOf(l, fmt());
      if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h) return l;
    }
    return null;
  }

  // ---------- Canvas interaction ----------
  function canvasCoords(evt){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
    return { x: cx*scaleX, y: cy*scaleY };
  }

  function startDrag(evt){
    const p = canvasCoords(evt);
    const hit = hitTest(p.x, p.y);
    if(hit){
      select(hit.id);
      dragState = { id:hit.id, offX: p.x-hit.x, offY: p.y-hit.y, startX:hit.x, startY:hit.y, px:p.x, py:p.y, isTextLike: hit.type==='text'||hit.type==='cta' };
    } else {
      select(null);
    }
    render();
  }
  function moveDrag(evt){
    if(!dragState) return;
    evt.preventDefault();
    const p = canvasCoords(evt);
    const l = layers.find(x=>x.id===dragState.id);
    if(!l) return;
    const dx = p.x - dragState.px, dy = p.y - dragState.py;
    l.x += dx; l.y += dy;
    dragState.px = p.x; dragState.py = p.y;
    render();
  }
  function endDrag(){ dragState = null; }

  canvas.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', startDrag, {passive:true});
  window.addEventListener('touchmove', moveDrag, {passive:false});
  window.addEventListener('touchend', endDrag);

  // ---------- Background & brand wiring ----------
  const bgSwatchEl = document.getElementById('bgSwatches');
  function renderBgSwatches(){
    bgSwatchEl.innerHTML = '';
    PALETTE.forEach(c=>{
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c.toLowerCase()===bgColor.toLowerCase() ? ' active':'');
      sw.style.background = c;
      sw.addEventListener('click', ()=>{ bgColor=c; renderBgSwatches(); render(); });
      bgSwatchEl.appendChild(sw);
    });
  }
  renderBgSwatches();

  const LOGOS = {
    chuply:    { label:'Chuply',    src: CHUPLY_LOGO },
    shopfront: { label:'ShopFront', src: SHOPFRONT_LOGO },
    ops:       { label:'Ops',       src: OPS_LOGO },
    schools:   { label:'Schools',   src: SCHOOLS_LOGO },
    rewards:   { label:'Rewards',   src: REWARDS_LOGO },
    summaries: { label:'Summaries', src: SUMMARIES_LOGO },
  };

  const logoGridEl = document.getElementById('logoGrid');
  function renderLogoGrid(){
    logoGridEl.innerHTML = '';
    Object.values(LOGOS).forEach(l=>{
      const btn = document.createElement('div');
      btn.className = 'logo-btn';
      btn.title = 'Insert ' + l.label + ' logo';
      const thumb = document.createElement('img');
      thumb.src = l.src;
      thumb.alt = l.label;
      const label = document.createElement('span');
      label.textContent = l.label;
      btn.appendChild(thumb);
      btn.appendChild(label);
      btn.addEventListener('click', ()=>{
        const testImg = new Image();
        testImg.onload = ()=>{
          imageCache[l.src] = testImg;
          addImageLayer(l.src, testImg.naturalWidth, testImg.naturalHeight);
        };
        testImg.src = l.src;
      });
      logoGridEl.appendChild(btn);
    });
  }
  renderLogoGrid();

  // ---------- Toolbar wiring ----------
  document.getElementById('addText').addEventListener('click', ()=>{
    if(layers.filter(l=>l.type==='text').length===0) addTextLayer('headline');
    else addTextLayer('body');
  });
  document.getElementById('addCta').addEventListener('click', addCtaBadge);
  document.getElementById('addShape').addEventListener('click', addShapeLayer);
  document.getElementById('addImage').addEventListener('click', ()=>{ fileInput.dataset.mode='new'; fileInput.click(); });

  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const dataUrl = ev.target.result;
      const testImg = new Image();
      testImg.onload = ()=>{
        if(fileInput.dataset.mode==='replace'){
          const l = layers.find(x=>x.id===fileInput.dataset.target);
          if(l){
            l.src = dataUrl; l.natW = testImg.naturalWidth; l.natH = testImg.naturalHeight;
            imageCache[dataUrl] = testImg; render();
          }
        } else {
          imageCache[dataUrl] = testImg;
          addImageLayer(dataUrl, testImg.naturalWidth, testImg.naturalHeight, {fit:'cover'});
        }
      };
      testImg.src = dataUrl;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // Format tabs
  const fmtTabs = document.getElementById('fmtTabs');
  Object.keys(FORMATS).forEach(key=>{
    const b = document.createElement('button');
    b.textContent = FORMATS[key].label;
    b.className = key===currentFormat ? 'active' : '';
    b.addEventListener('click', ()=>{
      currentFormat = key;
      [...fmtTabs.children].forEach(c=>c.classList.remove('active'));
      b.classList.add('active');
      setCanvasSize();
      layers.forEach(l=>{
        if(l.type==='image' && (l.fitMode==='cover' || l.fitMode==='contain')) fitImageLayerToCanvas(l, l.fitMode);
      });
      renderProps(); render();
    });
    fmtTabs.appendChild(b);
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    selectedId = null; render(); // hide selection outline in export
    const link = document.createElement('a');
    link.download = `chuply-ad-${currentFormat}-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---------- Init ----------
  setCanvasSize();
  addTextLayer('headline');
  addCtaBadge();
  render();
})();
</script>
</body>
</html>
